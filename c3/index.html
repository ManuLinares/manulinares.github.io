        let isSmoothed = true;

        function movingAverage(data, windowSize = 5) {
            let result = [];
            for (let i = 0; i < data.length; i++) {
                if (data[i] === null) {
                    result.push(null);
                    continue;
                }
                let start = Math.max(0, i - Math.floor(windowSize / 2));
                let end = Math.min(data.length, i + Math.ceil(windowSize / 2));
                let slice = data.slice(start, end).filter(v => v !== null);
                if (slice.length === 0) {
                    result.push(null);
                    continue;
                }
                let sum = slice.reduce((a, b) => a + b, 0);
                result.push(Number((sum / slice.length).toFixed(3)));
            }
            return result;
        }

        const commonOptions = {
            backgroundColor: 'transparent',
            tooltip: {
                trigger: 'axis',
                backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#f1f5f9' },
                formatter: function (params) {
                    const idx = params[0].dataIndex;
                    let res = `<div style="font-weight:600;border-bottom:1px solid #334155;padding-bottom:4px;margin-bottom:4px">Commit: ${commits[idx]}</div>`;
                    res += `<div style="font-size:11px;color:#94a3b8;font-family:'JetBrains Mono'">${full_commits[idx]}</div>`;
                    res += `<div style="font-size:12px;color:#94a3b8;margin-bottom:8px">${dates[idx]}</div>`;
                    params.forEach(item => {
                        res += `<div style="display:flex;justify-content:space-between;gap:20px;font-size:13px">
                            <span>${item.marker} ${item.seriesName}</span>
                            <span style="font-weight:600;font-family:'JetBrains Mono'">${item.value}</span>
                        </div>`;
                    });
                    return res;
                }
            },
            legend: { type: 'scroll', textStyle: { color: '#94a3b8' }, top: 30, left: 'center' },
            grid: { left: '4%', right: '4%', bottom: '80px', top: '80px', containLabel: true },
            dataZoom: [{ type: 'inside' }, { type: 'slider', bottom: '10px', textStyle: { color: '#94a3b8' }, borderColor: '#334155' }],
            xAxis: {
                type: 'category', boundaryGap: false, data: labels,
                axisLabel: { color: '#94a3b8', rotate: 45, interval: 'auto' },
                axisLine: { lineStyle: { color: '#334155' } }
            },
            yAxis: { type: 'value', axisLabel: { color: '#94a3b8' }, splitLine: { lineStyle: { color: '#334155', type: 'dashed' } }, axisLine: { lineStyle: { color: '#334155' } } }
        };

        const processSeries = (series) => series.map(s => ({
            ...s,
            data: isSmoothed ? movingAverage(s.data) : s.data
        }));

        const timingSelected = {};
        timingSeries.forEach(s => {
            if (optLevels.length <= 1) timingSelected[s.name] = true;
            else timingSelected[s.name] = s.name.includes(`(-O${optLevels[0]})`);
        });
        const memorySelected = {};
        memorySeries.forEach(s => {
            if (optLevels.length <= 1) memorySelected[s.name] = true;
            else memorySelected[s.name] = s.name.includes(`(-O${optLevels[0]})`);
        });

        const timingChart = echarts.init(document.getElementById('timing-chart'));
        const memoryChart = echarts.init(document.getElementById('memory-chart'));

        function syncCharts() {
            const update = (chart, series) => {
                const legendData = [];
                const selected = {};

                series.forEach(s => {
                    const match = s.name.match(/\(-O(\w+)\)/);
                    const opt = match ? match[1] : (optLevels[0] || "0");
                    const isActive = optStates[opt];

                    if (isActive) {
                        legendData.push(s.name);
                    }
                    selected[s.name] = isActive;
                });

                chart.setOption({
                    legend: { data: legendData, selected: selected }
                });
            };

            const processedTiming = processSeries(timingSeries);
            const processedMemory = processSeries(memorySeries);

            timingChart.setOption({
                ...commonOptions,
                title: { text: 'Timing Metrics (ms)', textStyle: { color: '#f1f5f9' } },
                series: processedTiming
            });
            memoryChart.setOption({
                ...commonOptions,
                title: { text: 'Memory & Allocations', textStyle: { color: '#f1f5f9' } },
                series: processedMemory
            });

            update(timingChart, timingSeries);
            update(memoryChart, memorySeries);
        }

        document.getElementById('denoise-btn').addEventListener('click', function() {
            isSmoothed = !isSmoothed;
            this.classList.toggle('active');
            this.innerText = isSmoothed ? 'Denoise Data: ON' : 'Denoise Data: OFF';
            syncCharts();
        });

        // Optimization Level Toggles
        const optContainer = document.getElementById('opt-toggles');
        const optStates = {};
        optLevels.forEach((opt, idx) => {
            const isActive = (idx === 0);
            optStates[opt] = isActive;
            const btn = document.createElement('button');
            btn.className = `opt-btn ${isActive ? 'active' : ''}`;
            btn.innerText = `Toggle -O${opt}`;
            btn.onclick = () => {
                optStates[opt] = !optStates[opt];
                btn.classList.toggle('active');
                syncCharts();
            };
            optContainer.appendChild(btn);
        });

        const setupInteractivity = (chart) => {
            let currentIndex = -1;

            chart.on('updateAxisPointer', (event) => {
                if (event.axesInfo && event.axesInfo.length > 0) {
                    currentIndex = event.axesInfo[0].value;
                }
            });

            chart.getZr().on('click', (params) => {
                if (currentIndex !== -1 && chart.containPixel('grid', [params.offsetX, params.offsetY])) {
                    const hash = full_commits[currentIndex];
                    if (hash) window.open(`https://github.com/c3lang/c3c/commit/${hash}`, '_blank');
                }
            });

            chart.getZr().on('mousemove', (params) => {
                const isInside = chart.containPixel('grid', [params.offsetX, params.offsetY]);
                chart.getZr().setCursorStyle(isInside ? 'pointer' : 'default');
            });
        };

        setupInteractivity(timingChart);
        setupInteractivity(memoryChart);

        syncCharts();

        window.addEventListener('resize', () => { timingChart.resize(); memoryChart.resize(); });
    </script>
