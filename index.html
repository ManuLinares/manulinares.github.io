<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Manuel Barrio Linares</title>
	<link rel="icon" href="avatar.webp" type="image/x-icon">
	<style>
		:root {
			--text: #fff;
			--bg: #000;
			--bg-gradient: radial-gradient(ellipse at bottom, rgba(245, 70, 66, 0.25) 0%, #000 65%), url('flcl.webp') center / cover no-repeat fixed;
			--profile-border: rgba(255, 255, 255, 0.3);
			--profile-border-hover: #fff;
			--tooltip-bg: rgba(17, 20, 29, 0.95);
			--tooltip-border: rgba(255, 255, 255, 0.2);
			--tooltip-text: #fff;
			--link-bg: rgba(255, 255, 255, 0.08);
			--link-border: rgba(255, 255, 255, 0.25);
			--link-color: #fff;
			--link-hover-bg: #fff;
			--link-hover-color: #000;
			--blog-title-color: rgba(255, 255, 255, 0.5);
			--blog-link-color: #fff;
			--blog-date-color: rgba(255, 255, 255, 0.4);
			--blog-hover-bg: rgba(255, 255, 255, 0.08);
			--hashtag-shine: #fff;
			--shadow: rgba(0, 0, 0, 0.5);
		}

		@media (prefers-color-scheme: light) {
			:root {
				--text: #1f2937;
				--bg: #f9fafb;
				--bg-gradient:
					radial-gradient(ellipse at bottom, rgba(245, 70, 66, 0.08) 0%, transparent 70%),
					linear-gradient(rgba(249, 250, 251, 0.88), rgba(249, 250, 251, 0.88)),
					url('flcl.webp') center / cover no-repeat fixed #f9fafb;
				--profile-border: rgba(0, 0, 0, 0.2);
				--profile-border-hover: #1f2937;
				--tooltip-bg: rgba(255, 255, 255, 0.95);
				--tooltip-border: rgba(0, 0, 0, 0.15);
				--tooltip-text: #1f2937;
				--link-bg: rgba(0, 0, 0, 0.05);
				--link-border: rgba(0, 0, 0, 0.15);
				--link-color: #1f2937;
				--link-hover-bg: #1f2937;
				--link-hover-color: #fff;
				--blog-title-color: rgba(0, 0, 0, 0.5);
				--blog-link-color: #1f2937;
				--blog-date-color: rgba(0, 0, 0, 0.45);
				--blog-hover-bg: rgba(0, 0, 0, 0.05);
				--hashtag-shine: #1f2937;
				--shadow: rgba(0, 0, 0, 0.12);
			}
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			padding: 64px 16px 24px;
			min-height: 100dvh;
			display: flex;
			flex-direction: column;
			align-items: center;
			font-family: system-ui, sans-serif;
			background: var(--bg-gradient);
			color: var(--text);
		}

		#stars {
			position: fixed;
			inset: 0;
			z-index: -1;
			pointer-events: none;
			transform: translateZ(0);
		}

		#profilePicture {
			position: relative;
			width: 96px;
			height: 96px;
			margin-bottom: 16px;
			border-radius: 50%;
			border: 2px solid var(--profile-border);
			transition: transform 0.2s, border-color 0.2s;
		}

		#profilePicture:hover {
			transform: scale(1.05);
			border-color: var(--profile-border-hover);
		}

		#profilePicture img {
			width: 100%;
			height: 100%;
			border-radius: 50%;
			object-fit: cover;
			display: block;
		}

		.quote-tooltip {
			position: absolute;
			bottom: calc(100% + 12px);
			left: 50%;
			transform: translateX(-50%) translateY(6px);
			width: max-content;
			max-width: min(280px, 80vw);
			padding: 8px 14px;
			border-radius: 8px;
			background: var(--tooltip-bg);
			border: 1px solid var(--tooltip-border);
			color: var(--tooltip-text);
			font-family: Baskerville, Georgia, serif;
			font-style: italic;
			font-size: 0.9rem;
			line-height: 1.35;
			text-align: center;
			pointer-events: none;
			opacity: 0;
			transition: opacity 0.2s, transform 0.2s;
			z-index: 10;
			box-shadow: 0 4px 16px var(--shadow);
		}

		.quote-tooltip::before {
			content: '';
			position: absolute;
			bottom: -5px;
			left: 50%;
			transform: translateX(-50%) rotate(45deg);
			width: 8px;
			height: 8px;
			background: var(--tooltip-bg);
			border-bottom: 1px solid var(--tooltip-border);
			border-right: 1px solid var(--tooltip-border);
		}

		#profilePicture:hover .quote-tooltip {
			opacity: 1;
			transform: translateX(-50%) translateY(0);
		}

		#userName {
			font-size: 1rem;
			font-weight: 700;
			letter-spacing: -0.01em;
			color: var(--text);
			text-decoration: none;
			margin-bottom: 24px;
			transition: opacity 0.2s;
		}

		#userName:hover {
			opacity: 0.8;
			text-decoration: underline;
		}

		#links {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			gap: 12px;
			max-width: 420px;
			margin-bottom: 24px;
		}

		.link {
			position: relative;
			width: 44px;
			height: 44px;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			border-radius: 50%;
			background: var(--link-bg);
			border: 1px solid var(--link-border);
			color: var(--link-color);
			text-decoration: none;
			transition: background-color 0.15s, color 0.15s;
		}

		.link:hover {
			background: var(--link-hover-bg);
			color: var(--link-hover-color);
		}

		.link>* {
			transition: transform 0.15s;
		}

		.link:hover>* {
			transform: translateY(-2px);
		}

		.link::before {
			content: '';
			position: absolute;
			bottom: calc(100% + 4px);
			left: 50%;
			transform: translateX(-50%) rotate(45deg);
			width: 6px;
			height: 6px;
			background: var(--tooltip-bg);
			border-bottom: 1px solid var(--tooltip-border);
			border-right: 1px solid var(--tooltip-border);
			pointer-events: none;
			opacity: 0;
			transition: opacity 0.15s;
			z-index: 6;
		}

		.link::after {
			content: attr(data-tooltip);
			position: absolute;
			bottom: calc(100% + 8px);
			left: 50%;
			transform: translateX(-50%) translateY(4px);
			background: var(--tooltip-bg);
			border: 1px solid var(--tooltip-border);
			color: var(--tooltip-text);
			font-size: 0.75rem;
			font-weight: 600;
			letter-spacing: 0.02em;
			padding: 4px 8px;
			border-radius: 6px;
			white-space: nowrap;
			pointer-events: none;
			opacity: 0;
			transition: opacity 0.15s, transform 0.15s;
			box-shadow: 0 4px 12px var(--shadow);
			z-index: 5;
		}

		.link:hover::before,
		.link:hover::after,
		.link:focus-visible::before,
		.link:focus-visible::after {
			opacity: 1;
		}

		.link:hover::after,
		.link:focus-visible::after {
			transform: translateX(-50%) translateY(0);
		}

		.icon {
			width: 20px;
			height: 20px;
			display: block;
		}

		.cv-text {
			font-size: 0.85rem;
			font-weight: 700;
			letter-spacing: 0.05em;
			line-height: 1;
		}

		#music-btn {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			padding: 8px 18px;
			margin-bottom: 24px;
			border-radius: 24px;
			background: var(--link-bg);
			border: 1px solid var(--link-border);
			color: var(--link-color);
			text-decoration: none;
			font-size: 0.9rem;
			font-weight: 600;
			letter-spacing: 0.02em;
			transition: background-color 0.15s, color 0.15s, transform 0.15s;
		}

		#music-btn:hover {
			background: var(--link-hover-bg);
			color: var(--link-hover-color);
			transform: translateY(-2px);
		}

		#blog-section {
			width: 100%;
			max-width: 650px;
			margin: 8px 0 20px;
		}

		.blog-title {
			font-size: 0.8rem;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: 0.08em;
			color: var(--blog-title-color);
			text-align: center;
			margin-bottom: 10px;
		}

		.blog-list {
			list-style: none;
			padding: 0;
			margin: 0;
		}

		.blog-list li {
			display: flex;
			justify-content: space-between;
			align-items: baseline;
			gap: 12px;
			padding: 6px 10px;
			border-radius: 6px;
			transition: background-color 0.15s;
		}

		.blog-list li:hover {
			background: var(--blog-hover-bg);
		}

		.blog-list a {
			color: var(--blog-link-color);
			text-decoration: none;
			font-size: 0.95rem;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.blog-list a:hover {
			text-decoration: underline;
		}

		.blog-list .blog-date {
			font-size: 0.8rem;
			color: var(--blog-date-color);
			font-family: monospace;
			white-space: nowrap;
		}

		#hashtag {
			font-size: 1rem;
			text-align: center;
			background: linear-gradient(90deg, transparent, var(--hashtag-shine) 50%, transparent) no-repeat;
			background-size: 80%;
			-webkit-background-clip: text;
			background-clip: text;
			-webkit-text-fill-color: transparent;
			color: transparent;
			animation: shine 3s linear infinite;
		}

		@keyframes shine {
			0% {
				background-position: -500%;
			}
			100% {
				background-position: 500%;
			}
		}
	</style>
</head>

	<script>
		const c = document.getElementById('stars');
		const ctx = c.getContext('2d');
		const mql = window.matchMedia('(prefers-color-scheme: light)');
		let w = 0, h = 0;

		const darkColors = ['rgba(255, 255, 255, 0.35)', 'rgba(255, 255, 255, 0.7)', '#fff'];
		const lightColors = ['rgba(31, 41, 55, 0.2)', 'rgba(31, 41, 55, 0.45)', 'rgba(31, 41, 55, 0.75)'];

		const layers = [
			[260, 1, 0.2],
			[100, 2, 0.55],
			[40, 3, 1.1]
		].map(([n, size, speed]) => ({
			size, speed,
			pts: Array.from({ length: n }, () => ({ x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight }))
		}));

		function resize() {
			w = c.width = window.innerWidth;
			h = c.height = window.innerHeight;
		}

		function loop() {
			ctx.clearRect(0, 0, w, h);
			const colors = mql.matches ? lightColors : darkColors;
			for (let i = 0; i < layers.length; i++) {
				const l = layers[i];
				ctx.fillStyle = colors[i];
				for (const p of l.pts) {
					p.y -= l.speed;
					if (p.y < 0) { p.y = h; p.x = Math.random() * w; }
					ctx.fillRect(p.x, p.y, l.size, l.size);
				}
			}
			requestAnimationFrame(loop);
		}

		window.addEventListener('resize', resize, { passive: true });
		resize();
		loop();
	</script>
