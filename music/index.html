<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music | Manuel Barrio Linares</title>
  <link rel="icon" href="../avatar.webp" type="image/x-icon">
  <style>
    :root {
      --bg: #121212;
      --card-bg: #181818;
      --card-hover: #282828;
      --player-bg: #181818;
      --border: #282828;
      --text: #ffffff;
      --text-dim: #b3b3b3;
      --accent: #1db954;
      --accent-hover: #1ed760;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 96px;
    }

    header {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 20px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    header a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.95rem;
    }

    header a:hover { color: var(--text); }
    header h1 { font-size: 1.5rem; }

    .search-box {
      width: 100%;
      max-width: 900px;
      margin: 20px auto 16px;
      padding: 0 20px;
      display: flex;
      justify-content: center;
    }

    .search-box input {
      width: 100%;
      max-width: 500px;
      padding: 10px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }

    .search-box input:focus { border-color: var(--text-dim); }

    .tracklist {
      list-style: none;
      padding: 0 20px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    .track-row {
      display: grid;
      grid-template-columns: 36px 1fr 100px 50px;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
    }

    .track-row:hover { background: var(--card-hover); }
    .track-row.active { background: #2a2a2a; color: var(--accent); }
    .track-row.active .track-artist { color: var(--accent); opacity: 0.8; }

    .track-num {
      color: var(--text-dim);
      font-size: 0.9rem;
      font-variant-numeric: tabular-nums;
    }

    .track-meta { overflow: hidden; }
    .track-title {
      font-size: 0.95rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-date {
      font-size: 0.8rem;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
      text-align: right;
      white-space: nowrap;
    }

    .track-dur {
      font-size: 0.85rem;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
      text-align: right;
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      .track-row {
        grid-template-columns: 32px 1fr 48px;
      }
      .track-date {
        display: none;
      }
    }

    .player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 84px;
      background: var(--player-bg);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      align-items: center;
      padding: 0 24px;
      z-index: 100;
    }

    .player-current {
      min-width: 0;
      padding-right: 16px;
    }

    .player-current .title {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-current .artist {
      font-size: 0.75rem;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-group button {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-group button:hover { color: var(--text); }

    .btn-play {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #ffffff !important;
      color: #000000 !important;
    }

    .btn-play:hover { transform: scale(1.05); }

    .timeline {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 500px;
    }

    .timeline span {
      font-size: 0.75rem;
      color: var(--text-dim);
      width: 36px;
      font-variant-numeric: tabular-nums;
    }

    .timeline span.right { text-align: right; }

    .slider {
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: #4d4d4d;
      outline: none;
      appearance: none;
      cursor: pointer;
    }

    .slider::-webkit-slider-thumb {
      appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }

    .volume-box {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
    }

    .volume-box .slider { max-width: 100px; }
  </style>
</head>
<body>
  <header>
    <h1>Music</h1>
    <a href="/">&larr; Home</a>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search track or artist...">
  </div>

  <ul class="tracklist" id="tracklist"></ul>

  <div class="player-bar">
    <div class="player-current">
      <div class="title" id="nowTitle">-</div>
      <div class="artist" id="nowArtist">-</div>
    </div>

    <div class="player-controls">
      <div class="btn-group">
        <button id="prevBtn" title="Previous">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="btn-play" id="playBtn" title="Play">
          <svg id="playIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="nextBtn" title="Next">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>

      <div class="timeline">
        <span id="curTime">0:00</span>
        <input type="range" class="slider" id="progressBar" min="0" value="0" step="0.1">
        <span class="right" id="durTime">0:00</span>
      </div>
    </div>

    <div class="volume-box">
      <input type="range" class="slider" id="volBar" min="0" max="1" step="0.01" value="1">
    </div>
  </div>

  <audio id="audio"></audio>

  <script>
    const audio = document.getElementById('audio');
    const tracklistEl = document.getElementById('tracklist');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressBar = document.getElementById('progressBar');
    const curTime = document.getElementById('curTime');
    const durTime = document.getElementById('durTime');
    const volBar = document.getElementById('volBar');
    const nowTitle = document.getElementById('nowTitle');
    const nowArtist = document.getElementById('nowArtist');
    const searchInput = document.getElementById('searchInput');

    let playlist = [];
    let currentIndex = -1;

    function fmtTime(sec) {
      if (isNaN(sec)) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function renderList(tracks) {
      tracklistEl.innerHTML = '';
      tracks.forEach((t) => {
        const li = document.createElement('li');
        li.className = `track-row ${playlist[currentIndex]?.id === t.id ? 'active' : ''}`;
        li.innerHTML = `
          <div class="track-num">${t.id}</div>
          <div class="track-meta">
            <div class="track-title">${t.title}</div>
            <div class="track-artist">${t.artist || 'Manuel Barrio Linares'}</div>
          </div>
          <div class="track-date">${t.date || ''}</div>
          <div class="track-dur">${t.duration || ''}</div>
        `;
        li.onclick = () => playTrackById(t.id);
        tracklistEl.appendChild(li);
      });
    }

    function playTrackById(id) {
      const idx = playlist.findIndex(t => t.id === id);
      if (idx !== -1) loadAndPlay(idx);
    }

    function loadAndPlay(idx) {
      currentIndex = idx;
      const t = playlist[idx];
      audio.src = t.src;
      nowTitle.textContent = t.title;
      nowArtist.textContent = t.artist || 'Manuel Barrio Linares';
      audio.play();
      updatePlayIcon(true);
      renderList(getFilteredTracks());
    }

    function updatePlayIcon(isPlaying) {
      playIcon.innerHTML = isPlaying
        ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
        : '<path d="M8 5v14l11-7z"/>';
    }

    playBtn.onclick = () => {
      if (currentIndex === -1 && playlist.length) {
        loadAndPlay(0);
        return;
      }
      if (audio.paused) {
        audio.play();
        updatePlayIcon(true);
      } else {
        audio.pause();
        updatePlayIcon(false);
      }
    };

    nextBtn.onclick = () => {
      if (playlist.length === 0) return;
      loadAndPlay((currentIndex + 1) % playlist.length);
    };

    prevBtn.onclick = () => {
      if (playlist.length === 0) return;
      loadAndPlay((currentIndex - 1 + playlist.length) % playlist.length);
    };

    audio.onended = () => nextBtn.onclick();

    audio.ontimeupdate = () => {
      if (!audio.duration) return;
      progressBar.value = (audio.currentTime / audio.duration) * 100;
      curTime.textContent = fmtTime(audio.currentTime);
      durTime.textContent = fmtTime(audio.duration);
    };

    progressBar.oninput = () => {
      if (!audio.duration) return;
      audio.currentTime = (progressBar.value / 100) * audio.duration;
    };

    volBar.oninput = () => audio.volume = volBar.value;

    function getFilteredTracks() {
      const q = searchInput.value.toLowerCase();
      if (!q) return playlist;
      return playlist.filter(t =>
        t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q)
      );
    }

    searchInput.oninput = () => renderList(getFilteredTracks());

    fetch('playlist.json')
      .then(res => res.json())
      .then(data => {
        playlist = data;
        renderList(playlist);
      })
      .catch(err => console.error("Could not load playlist:", err));
  </script>
</body>
</html>
