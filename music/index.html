<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music | Manuel Barrio Linares</title>
  <link rel="icon" href="../avatar.webp" type="image/x-icon">
  <style>
    :root {
      --bg: #121212;
      --card-bg: #181818;
      --card-hover: #282828;
      --player-bg: #181818;
      --border: #282828;
      --text: #ffffff;
      --text-dim: #b3b3b3;
      --accent: #1db954;
      --accent-hover: #1ed760;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(ellipse at bottom, rgba(245, 70, 66, 0.12) 0%, #121212 70%), url('../flcl.webp') center / cover no-repeat fixed #121212;
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 96px;
    }

    header {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 20px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    header a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.95rem;
    }

    header a:hover { color: var(--text); }
    header h1 { font-size: 1.5rem; }

    .search-box {
      position: sticky;
      top: 0;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      justify-content: center;
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(8px);
      z-index: 10;
    }

    .search-wrap {
      position: relative;
      width: 100%;
      max-width: 500px;
    }

    .search-wrap input {
      width: 100%;
      padding: 10px 36px 10px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }

    .search-wrap input:focus { border-color: var(--text-dim); }

    #searchClear {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .search-wrap input:not(:placeholder-shown) + #searchClear {
      display: flex;
    }

    #searchClear:hover { color: var(--text); }

    .tracklist {
      list-style: none;
      padding: 0 20px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    .track-row {
      display: grid;
      grid-template-columns: 36px 1fr 100px 50px;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      scroll-margin-top: 70px;
      scroll-margin-bottom: 96px;
    }

    .track-row:hover, .track-row.selected { background: var(--card-hover); }
    .track-row.selected { outline: 1px solid #555; }
    .track-row.active { background: #2a2a2a; color: var(--accent); }
    .track-row.active .track-artist { color: var(--accent); opacity: 0.8; }

    .track-num {
      color: var(--text-dim);
      font-size: 0.9rem;
      font-variant-numeric: tabular-nums;
    }

    .track-meta { overflow: hidden; }
    .track-title {
      font-size: 0.95rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-date {
      font-size: 0.8rem;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
      text-align: right;
      white-space: nowrap;
    }

    .track-dur {
      font-size: 0.85rem;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
      text-align: right;
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      .track-row {
        grid-template-columns: 32px 1fr 48px;
      }
      .track-date {
        display: none;
      }
    }

    .player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 84px;
      background: var(--player-bg);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      align-items: center;
      padding: 0 24px;
      z-index: 100;
    }

    .player-current {
      min-width: 0;
      padding-right: 16px;
    }

    .player-current .title {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }
    .player-current .title:hover { text-decoration: underline; }

    .player-current .artist {
      font-size: 0.75rem;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }
    .player-current .artist:hover { text-decoration: underline; color: var(--text); }

    .player-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-group button {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-group button:hover { color: var(--text); }

    .btn-play {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #ffffff !important;
      color: #000000 !important;
    }

    .btn-play:hover { transform: scale(1.05); }

    .timeline {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 500px;
      height: 16px;
    }

    .timeline::before,
    .volume-box::before {
      content: '';
      position: absolute;
      inset: -12px 0;
    }

    .timeline span {
      font-size: 0.75rem;
      color: var(--text-dim);
      width: 36px;
      font-variant-numeric: tabular-nums;
      position: relative;
      z-index: 1;
    }

    .timeline span.right { text-align: right; }

    .slider {
      position: relative;
      z-index: 1;
      flex: 1;
      height: 16px;
      background: transparent;
      outline: none;
      appearance: none;
      cursor: pointer;
    }

    .slider::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 2px;
      background: #4d4d4d;
    }

    .slider::-moz-range-track {
      height: 4px;
      border-radius: 2px;
      background: #4d4d4d;
    }

    .slider::-webkit-slider-thumb {
      appearance: none;
      width: 10px;
      height: 10px;
      margin-top: -3px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }

    .slider::-moz-range-thumb {
      width: 10px;
      height: 10px;
      border: none;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }

    .volume-box {
      position: relative;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      height: 16px;
    }

    .volume-box .slider { max-width: 100px; }
  </style>
</head>
<body>
  <header>
    <h1>Music</h1>
    <a href="/">&larr; Home</a>
  </header>

  <div class="search-box">
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Search track or artist...">
      <button id="searchClear" title="Clear search" aria-label="Clear search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>

  <ul class="tracklist" id="tracklist"></ul>

  <div class="player-bar">
    <div class="player-current">
      <div class="title" id="nowTitle">-</div>
      <div class="artist" id="nowArtist">-</div>
    </div>

    <div class="player-controls">
      <div class="btn-group">
        <button id="prevBtn" title="Previous">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="btn-play" id="playBtn" title="Play">
          <svg id="playIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="nextBtn" title="Next">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>

      <div class="timeline">
        <span id="curTime">0:00</span>
        <input type="range" class="slider" id="progressBar" min="0" value="0" step="0.1">
        <span class="right" id="durTime">0:00</span>
      </div>
    </div>

    <div class="volume-box">
      <input type="range" class="slider" id="volBar" min="0" max="1" step="0.01" value="1">
    </div>
  </div>

  <audio id="audio"></audio>

  <script>
    const audio = document.getElementById('audio');
    const tracklistEl = document.getElementById('tracklist');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressBar = document.getElementById('progressBar');
    const curTime = document.getElementById('curTime');
    const durTime = document.getElementById('durTime');
    const volBar = document.getElementById('volBar');
    const nowTitle = document.getElementById('nowTitle');
    const nowArtist = document.getElementById('nowArtist');
    const searchInput = document.getElementById('searchInput');
    const searchClear = document.getElementById('searchClear');

    let playlist = [];
    let currentIndex = -1;
    let selectedIndex = -1;

    const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    const fmtTime = s => isNaN(s) ? '0:00' : `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
    const seek = dt => audio.duration && (audio.currentTime = Math.min(audio.duration, Math.max(0, audio.currentTime + dt)));
    const setVol = v => {
      audio.volume = volBar.value = Math.min(1, Math.max(0, v));
      try { localStorage.setItem('vol', audio.volume); } catch {}
    };

    function renderList(tracks) {
      selectedIndex = -1;
      tracklistEl.innerHTML = '';
      tracks.forEach((t) => {
        const li = document.createElement('li');
        li.className = `track-row ${playlist[currentIndex]?.id === t.id ? 'active' : ''}`;
        li.innerHTML = `
          <div class="track-num">${t.id}</div>
          <div class="track-meta">
            <div class="track-title">${t.title}</div>
            <div class="track-artist">${t.artist || 'Manuel Barrio Linares'}</div>
          </div>
          <div class="track-date">${t.date || ''}</div>
          <div class="track-dur">${t.duration || ''}</div>
        `;
        li.onclick = () => loadTrack(playlist.findIndex(p => p.id === t.id));
        tracklistEl.appendChild(li);
      });
    }

    function loadTrack(idx, autoPlay = true) {
      if (idx < 0 || idx >= playlist.length) return;
      currentIndex = idx;
      const t = playlist[idx];
      audio.src = t.src;
      nowTitle.textContent = t.title;
      nowArtist.textContent = t.artist || 'Manuel Barrio Linares';
      document.title = `${t.title} — ${t.artist || 'Manuel Barrio Linares'}`;
      try { localStorage.setItem('lastSong', t.title); } catch {}
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist || 'Manuel Barrio Linares' });
        navigator.mediaSession.setActionHandler('play', () => playBtn.click());
        navigator.mediaSession.setActionHandler('pause', () => playBtn.click());
        navigator.mediaSession.setActionHandler('previoustrack', () => prevBtn.click());
        navigator.mediaSession.setActionHandler('nexttrack', () => nextBtn.click());
      }
      if (autoPlay) {
        audio.play().then(() => updatePlayIcon(true)).catch(() => updatePlayIcon(false));
        history.replaceState(null, '', '?song=' + encodeURIComponent(t.title));
      }
      renderList(getFilteredTracks());
      document.querySelector('.track-row.active')?.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }

    function updatePlayIcon(isPlaying) {
      playIcon.innerHTML = isPlaying
        ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
        : '<path d="M8 5v14l11-7z"/>';
    }

    nowTitle.onclick = () => document.querySelector('.track-row.active')?.scrollIntoView({ block: 'center', behavior: 'smooth' });
    nowArtist.onclick = () => {
      if (currentIndex === -1) return;
      searchInput.value = playlist[currentIndex].artist || 'Manuel Barrio Linares';
      renderList(getFilteredTracks());
    };

    playBtn.onclick = () => {
      if (currentIndex === -1 && playlist.length) return loadTrack(0);
      audio.paused ? (audio.play(), updatePlayIcon(true)) : (audio.pause(), updatePlayIcon(false));
    };

    nextBtn.onclick = () => playlist.length && loadTrack((currentIndex + 1) % playlist.length);
    prevBtn.onclick = () => playlist.length && loadTrack((currentIndex - 1 + playlist.length) % playlist.length);
    audio.onended = () => nextBtn.onclick();

    audio.ontimeupdate = () => {
      if (!audio.duration) return;
      progressBar.value = (audio.currentTime / audio.duration) * 100;
      curTime.textContent = fmtTime(audio.currentTime);
      durTime.textContent = fmtTime(audio.duration);
    };

    progressBar.oninput = () => audio.duration && (audio.currentTime = (progressBar.value / 100) * audio.duration);
    document.querySelector('.timeline').onwheel = (e) => { e.preventDefault(); seek(e.deltaY < 0 ? 5 : -5); };

    volBar.oninput = () => setVol(volBar.value);
    document.querySelector('.volume-box').onwheel = (e) => { e.preventDefault(); setVol(audio.volume + (e.deltaY < 0 ? 0.05 : -0.05)); };

    function getFilteredTracks() {
      const q = norm(searchInput.value.trim());
      if (!q) return playlist;
      return playlist.filter(t => norm(t.title).includes(q) || norm(t.artist).includes(q));
    }

    function clearSearch(focus = false) {
      searchInput.value = '';
      renderList(playlist);
      document.querySelector('.track-row.active')?.scrollIntoView({ block: 'center', behavior: 'smooth' });
      focus ? searchInput.focus() : searchInput.blur();
    }

    searchInput.oninput = () => renderList(getFilteredTracks());
    searchClear.onclick = () => clearSearch(true);

    window.onkeydown = (e) => {
      if (e.key === 'Escape') return clearSearch(false);

      const rows = tracklistEl.children;

      if (document.activeElement === searchInput) {
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          if (!rows.length) return;
          e.preventDefault();
          rows[selectedIndex]?.classList.remove('selected');
          selectedIndex = e.key === 'ArrowDown'
            ? (selectedIndex + 1) % rows.length
            : (selectedIndex - 1 + rows.length) % rows.length;
          rows[selectedIndex]?.classList.add('selected');
          rows[selectedIndex]?.scrollIntoView({ block: 'nearest' });
          return;
        }
        if (e.key === 'Enter') {
          e.preventDefault();
          if (rows.length) rows[Math.max(0, selectedIndex)].click();
          return;
        }
        return;
      }

      if (e.code === 'Space') { e.preventDefault(); return playBtn.click(); }
      if (e.key === 'ArrowRight') { e.preventDefault(); return seek(5); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); return seek(-5); }
      if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) searchInput.focus();
    };

    function findTrack(query) {
      if (!query) return -1;
      const q = norm(query).replace(/[^a-z0-9]/g, '');
      let idx = playlist.findIndex(t => {
        const title = norm(t.title).replace(/[^a-z0-9]/g, '');
        return title === q || norm(t.title + ' ' + t.artist).replace(/[^a-z0-9]/g, '') === q;
      });
      if (idx !== -1) return idx;

      idx = playlist.findIndex(t => norm(t.title).replace(/[^a-z0-9]/g, '').includes(q));
      if (idx !== -1) return idx;

      const tokens = norm(query).split(/\W+/).filter(Boolean);
      let best = -1, max = 0;
      playlist.forEach((t, i) => {
        const text = norm(t.title + ' ' + t.artist);
        const score = tokens.filter(tok => text.includes(tok)).length;
        if (score > max) { max = score; best = i; }
      });
      return best;
    }

    fetch('playlist.json')
      .then(res => res.json())
      .then(data => {
        playlist = data;
        renderList(playlist);
        const savedVol = localStorage.getItem('vol');
        setVol(savedVol !== null ? parseFloat(savedVol) : 1);
        const songParam = new URLSearchParams(location.search).get('song');
        const target = songParam || localStorage.getItem('lastSong');
        if (target) {
          const idx = findTrack(target);
          if (idx !== -1) loadTrack(idx, Boolean(songParam));
        }
      })
      .catch(err => console.error("Could not load playlist:", err));
  </script>
</body>
</html>
